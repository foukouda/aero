# XFOIL reference case with corners (doubled points, written by ../corner_cases.py).
# Outputs are generated by ../generate.py with XFOIL 6.996 (gfortran, double precision).
description = "NACA 0012 SHARP LE (corners kept as doubled points)"
# XFOIL 6.996 writes NaN panel nodes for this geometry (PANGEN breaks down
# when a smooth nose carries a doubled point). aero must refuse it with an
# error instead of producing NaN; no numerical comparison is possible.
xfoil_failure = "XFOIL 6.996 PANGEN produces NaN nodes"

[airfoil]
kind = "file"
file = "airfoil.dat"
merge_duplicates = false

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[runs]]
mach = 0.0
polar = { start = -4.0, end = 10.0, step = 2.0 }
cp_alphas = [0.0, 5.0]
