# XFOIL reference case. Outputs are generated by ../generate.py with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 0012 with the XFOIL 6.996 default paneling (240 nodes, TE/LE ratio 0.3)"

[airfoil]
kind = "naca"
code = "0012"

[paneling]
n_nodes = 240
cvpar = 1.0
cterat = 0.3
ctrrat = 0.2

[[runs]]
mach = 0.0
polar = { start = -6.0, end = 12.0, step = 1.0 }
cp_alphas = [-4.0, 0.0, 4.0, 8.0]
