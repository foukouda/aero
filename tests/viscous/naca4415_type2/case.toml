# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 4415, Mach and Re varying with CL (TYPE 2: M sqrt(CL) = 0.2, Re sqrt(CL) = 1e6)"

[airfoil]
kind = "naca"
code = "4415"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "t2alpha"
type = 2
reynolds = 1000000.0
mach = 0.2
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = 1.0, end = 10.0, step = 1.0 }
points = [4.0]

[[viscous]]
name = "t2cl"
type = 2
mode = "cl"
reynolds = 1000000.0
mach = 0.2
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = 0.4, end = 1.4, step = 0.1 }
points = [0.8]
