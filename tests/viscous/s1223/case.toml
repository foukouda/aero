# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "Selig S1223 (UIUC), Re = 1e5: high lift at low Reynolds number"

[airfoil]
kind = "file"
file = "s1223.dat"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "re1e5"
reynolds = 100000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = -2.0, end = 14.0, step = 1.0 }
points = [0.0, 6.0, 12.0]
