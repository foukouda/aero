# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 23012, Re = 6e6"

[airfoil]
kind = "naca"
code = "23012"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "re6e6"
reynolds = 6000000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = -4.0, end = 16.0, step = 2.0 }
points = [5.0]
