# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "Eppler 387 (UIUC), Re = 2e5, prescribed CL"

[airfoil]
kind = "file"
file = "e387.dat"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "cl"
mode = "cl"
reynolds = 200000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = 0.2, end = 1.1, step = 0.05 }
points = [0.6]
