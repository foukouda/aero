# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "Eppler 387 (UIUC), Re = 2e5: laminar separation bubbles"

[airfoil]
kind = "file"
file = "e387.dat"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "re2e5"
reynolds = 200000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = -2.0, end = 12.0, step = 1.0 }
points = [0.0, 4.0, 8.0]
