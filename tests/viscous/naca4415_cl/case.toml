# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
#
# The point CL = 0.8 does not converge: the bottom transition alternates
# between x/c = 0.99 and the trailing edge at every Newton iteration.
description = "NACA 4415, Re = 1e6, prescribed CL, transition limit cycle"

[airfoil]
kind = "naca"
code = "4415"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "cl"
mode = "cl"
reynolds = 1000000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = 0.6, end = 1.0, step = 0.1 }
points = [0.8]
