# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 0012, Re = 1e6, alternative amplification rate (DAMP)"

[airfoil]
kind = "naca"
code = "0012"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "damp2"
damp2 = true
reynolds = 1000000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = 0.0, end = 10.0, step = 1.0 }
points = [4.0]
