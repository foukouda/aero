# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 2412 with a 10 deg flap (GDES FLAP 0.75 999 10, y/t 0.5), inviscid and Re = 1e6"
gdes = ["FLAP 0.75 999 10", "0.5"]

[airfoil]
kind = "naca"
code = "2412"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[runs]]
mach = 0.0
polar = { start = -4.0, end = 8.0, step = 2.0 }

[[viscous]]
name = "re1e6"
reynolds = 1000000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = -2.0, end = 8.0, step = 1.0 }
points = [3.0]
