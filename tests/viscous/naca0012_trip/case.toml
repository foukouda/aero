# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 0012, Re = 1e6, trips at x/c = 0.1"

[airfoil]
kind = "naca"
code = "0012"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "trip"
reynolds = 1000000.0
mach = 0.0
ncrit = 9.0
xtr = [0.1, 0.1]
polar = { start = 0.0, end = 10.0, step = 2.0 }
points = [2.0, 6.0]
