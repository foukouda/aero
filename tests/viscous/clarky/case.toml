# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "Clark Y (UIUC), Re = 5e5"

[airfoil]
kind = "file"
file = "clarky.dat"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "re5e5"
reynolds = 500000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = -4.0, end = 14.0, step = 1.0 }
points = [2.0, 8.0]
