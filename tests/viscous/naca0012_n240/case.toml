# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 0012, XFOIL 6.996 default paneling, Re = 1e6"

[airfoil]
kind = "naca"
code = "0012"

[paneling]
n_nodes = 240
cvpar = 1.0
cterat = 0.3
ctrrat = 0.2

[[viscous]]
name = "re1e6"
reynolds = 1000000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = 0.0, end = 12.0, step = 2.0 }
points = [6.0]
