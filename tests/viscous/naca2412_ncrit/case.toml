# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 2412, Re = 1e6, Ncrit 5 (top) and 11 (bottom)"

[airfoil]
kind = "naca"
code = "2412"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "n5_11"
reynolds = 1000000.0
mach = 0.0
ncrit = [5.0, 11.0]
xtr = [1.0, 1.0]
polar = { start = -4.0, end = 12.0, step = 2.0 }
points = [3.0]
