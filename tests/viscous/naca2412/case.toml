# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 2412, Re = 3e6, incompressible and Mach 0.3"

[airfoil]
kind = "naca"
code = "2412"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "re3e6"
reynolds = 3000000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = -6.0, end = 14.0, step = 1.0 }
points = [-4.0, 2.0, 8.0]

[[viscous]]
name = "re3e6_m03"
reynolds = 3000000.0
mach = 0.3
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = -4.0, end = 8.0, step = 2.0 }
points = [4.0]
