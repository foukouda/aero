# XFOIL viscous reference case. Outputs are generated by
# ../../reference/generate.py --root tests/viscous with XFOIL 6.996
# (gfortran, double precision); see ../README.md.
description = "NACA 23012, Re varying with CL (TYPE 3: Re CL = 1e6)"

[airfoil]
kind = "naca"
code = "23012"

[paneling]
n_nodes = 160
cvpar = 1.0
cterat = 0.15
ctrrat = 0.2

[[viscous]]
name = "t3"
type = 3
mode = "cl"
reynolds = 1000000.0
mach = 0.0
ncrit = 9.0
xtr = [1.0, 1.0]
polar = { start = 0.2, end = 1.2, step = 0.1 }
points = [0.6]
