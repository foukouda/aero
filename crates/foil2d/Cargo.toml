[package]
name = "aero-foil2d"
description = "2D airfoil flow solvers (XFOIL-compatible inviscid panel method)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aero_foil2d"

[dependencies]
aero-geometry.workspace = true
faer.workspace = true
serde.workspace = true
thiserror.workspace = true
specta = { workspace = true, optional = true }

[features]
# Derives `specta::Type` on the public data types (TypeScript bindings).
specta = ["dep:specta", "aero-geometry/specta"]

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
toml.workspace = true

[[bench]]
name = "inviscid"
harness = false

[lints]
workspace = true

[[bench]]
name = "viscous"
harness = false
