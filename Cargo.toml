[workspace]
resolver = "3"
members = ["crates/geometry", "crates/foil2d", "crates/optim", "crates/mission", "crates/aircraft", "crates/vlm", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-2.0-or-later"
repository = "https://github.com/foukouda/aero"

[workspace.dependencies]
aero-geometry = { path = "crates/geometry" }
aero-foil2d = { path = "crates/foil2d" }
aero-optim = { path = "crates/optim" }
aero-mission = { path = "crates/mission" }
aero-aircraft = { path = "crates/aircraft" }
aero-vlm = { path = "crates/vlm" }
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
toml = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.bench]
debug = true

# The numerical crates are much slower unoptimized (the viscous validation
# takes minutes): optimize them, and faer, in dev and test builds too.
[profile.dev.package.aero-foil2d]
opt-level = 2

[profile.dev.package.aero-geometry]
opt-level = 2

[profile.dev.package.aero-optim]
opt-level = 2

[profile.dev.package.aero-mission]
opt-level = 2

[profile.dev.package.aero-vlm]
opt-level = 2

[profile.dev.package.faer]
opt-level = 2
