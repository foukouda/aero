[package]
name = "aero-app"
description = "Desktop application of the aero airfoil toolkit (thin Tauri layer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "aero_app"

[[bin]]
name = "aero"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
aero-geometry = { workspace = true, features = ["specta"] }
aero-foil2d = { workspace = true, features = ["specta"] }
aero-optim = { workspace = true, features = ["specta"] }
aero-mission = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta.workspace = true
specta-typescript = "=0.0.12"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[lints]
workspace = true
